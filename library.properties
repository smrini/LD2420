sentence=Driver for the HLK-LD2420 presence sensor's plain-text (ON/OFF + Range) UART output, with room-distance filtering.
paragraph=Parses the sensor's simple ASCII output mode into presence/distance, with a configurable distance cutoff (plus exit-grace hysteresis) for room-only detection, event callbacks for presence/room enter/exit, and automatic baud-rate detection. Does not implement the sensor's binary configuration protocol (register/gate setup) -- distance filtering is done in software against the plain-text Range reading.
category=Sensors
url=https://github.com/smrini/LD2420
architectures=esp32
includes=LD2420.h
