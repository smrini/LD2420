; This file is only used when working inside this repo directly (e.g.
; `pio test -e native`). It has no effect on projects that pull this
; library in as a dependency via lib_deps.

[env:native]
platform = native
test_framework = unity
; Without this, PlatformIO doesn't build src/ into the test binary at
; all (to avoid src/ and the test's own main() colliding) -- which is
; why LD2420Parser.cpp was never compiled, hence the "undefined
; reference" instead of a normal compile error.
test_build_src = yes
; LD2420.cpp depends on Arduino.h (HardwareSerial) and can't build on
; the native platform -- only the dependency-free parser is tested here.
build_src_filter = +<*> -<LD2420.cpp>
